# .github/workflows/claude-autofix.yml
name: Claude Code Auto-fix
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
jobs:
  autofix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ secrets.PAT_TOKEN }} # push 권한 필요
      - name: Get Failed Logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run view ${{ github.event.workflow_run.id }} --log-failed | head -200 > failed_logs.txt
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            CI가 실패했다. failed_logs.txt를 읽고 원인을 분석해 수정한다.
            규칙:
            1. 테스트를 비활성화하지 않는다
            2. 최소한의 변경으로 수정한다
            3. 수정할 수 없으면 'CANNOT_FIX'라고 출력하고 파일을 고치지 않는다
          claude_args: '--max-turns 15 --allowedTools "Read,Edit,Write,Bash(npm *)"'
      - name: Commit and Push Fix
        run: |
          git config user.name "Claude Code Bot"
          git config user.email "claude-bot@example.com"
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git add -A
          git commit -m "fix: CI 실패 자동 수정 by Claude Code"
          git push
