# .github/workflows/slack-trigger.yml
name: Slack Triggered PR
on:
  repository_dispatch:
    types: [slack-command]
jobs:
  create-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Process Slack Command
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMAND: ${{ github.event.client_payload.command }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          # 네이티브 설치 (설치 위치 ~/.local/bin 을 PATH에 추가)
          curl -fsSL https://claude.ai/install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          # Claude Code로 작업 수행
          claude -p --allowedTools "Edit,Write,Bash(npm *),Bash(git *),Bash(gh *)" "$COMMAND"
          # 결과를 Slack으로 전송
          jq -n --arg t "Claude Code 작업 완료: $COMMAND" '{text: $t}' |
            curl -X POST "$SLACK_WEBHOOK" -H "Content-Type: application/json" -d @-
