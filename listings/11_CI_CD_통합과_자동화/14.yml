# .github/workflows/jira-to-pr.yml
name: Jira to PR
on:
  repository_dispatch:
    types: [jira-issue-created]
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      ISSUE_KEY: ${{ github.event.client_payload.issue.key }}
      ISSUE_SUMMARY: ${{ github.event.client_payload.issue.summary }}
      ISSUE_DESCRIPTION: ${{ github.event.client_payload.issue.description }}
    steps:
      - uses: actions/checkout@v6
      - name: Create Branch
        run: git checkout -b "feature/$ISSUE_KEY"
      - name: Claude Code Implementation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          claude -p --allowedTools "Edit,Write,Bash(npm *)" "Jira 이슈 $ISSUE_KEY 를 구현해줘.
          제목: $ISSUE_SUMMARY
          설명: $ISSUE_DESCRIPTION
          구현 후 테스트도 작성해줘."
      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Claude Code Bot"
          git config user.email "claude-bot@example.com"
          git add -A
          git commit -m "feat: $ISSUE_SUMMARY [$ISSUE_KEY]"
          git push -u origin "feature/$ISSUE_KEY"
          gh pr create \
            --title "[$ISSUE_KEY] $ISSUE_SUMMARY" \
            --body "Jira: https://yourcompany.atlassian.net/browse/$ISSUE_KEY"
